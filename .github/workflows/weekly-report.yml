name: 📊 Daily AI API Report (Gemini)

on:
  schedule:
    # Cron is UTC. 08:00 UTC == 14:00 (+06:00). v2.0: EVERY DAY
    # (deliberately offset from the 00:01 auto-update so the two do not push
    # to main at the same moment).
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: "Report period"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly

permissions:
  contents: write
  issues: write

jobs:
  generate-daily-report:
    name: Generate Daily Report with Gemini
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm install

      - name: Generate Report with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # v2.0: daily by default; weekly via manual dispatch
          REPORT_PERIOD: ${{ github.event.inputs.period || 'daily' }}
        run: node scripts/weekly-report.js

      - name: Save Dated Copy + Update Live Report
        run: |
          mkdir -p reports
          PERIOD=$( [ "${{ github.event.inputs.period || 'daily' }}" = "weekly" ] && echo weekly || echo daily )
          DATE=$(date +'%Y-%m-%d')
          cp reports/weekly-report.md reports/${PERIOD}-report-$DATE.md

      - name: Commit Report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Gemini Report Bot 📊"
          git add reports/
          git diff --staged --quiet || git commit -m "📊 $( [ "${{ github.event.inputs.period || 'daily' }}" = "weekly" ] && echo Weekly || echo Daily ) AI API Report - $(date +'%Y-%m-%d')"
          git push

      # v2.0 fix: the old "Create Discussion Post" step was a no-op (a try/catch
      # around console.log that never created the issue). Now it really posts.
      - name: Post Report as Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reportContent;
            try {
              reportContent = fs.readFileSync('reports/weekly-report.md', 'utf8');
            } catch(e) {
              reportContent = 'Report file missing — check the generation step logs.';
            }

            const period = context.payload.inputs?.period || 'daily';

            // v2.1 fix: this runs DAILY and called issues.create unconditionally, so the
            // repo filled up with one near-identical report issue per day. Keep a
            // single rolling issue per period instead, and let it grow by comment
            // rather than by opening a new issue.
            const marker = `<!-- ai-report:${period} -->`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'report',
              per_page: 100
            });
            const rollup = open.find(i => i.body && i.body.includes(marker));

            const summary = [
              `## ${period === 'weekly' ? 'Weekly' : 'Daily'} AI API Report — ${new Date().toISOString().split('T')[0]}`,
              '',
              reportContent.slice(0, 60000) || '(empty report)',
              '',
              marker,
              '*Rolled up by the AI Report workflow.*'
            ].join('\n');

            if (rollup) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: rollup.number,
                body: summary
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: rollup.number,
                body: `Run completed ${new Date().toISOString().replace('T', ' ').slice(0, 19)} UTC. The issue body now shows the latest report.`
              });
              core.info(`Updated ${period} report rollup #${rollup.number}.`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📊 ${period === 'weekly' ? 'Weekly' : 'Daily'} AI API Report`,
                body: summary,
                labels: ['report', 'automated']
              });
              core.info(`Created ${period} report rollup.`);
            }

      - name: Summary
        run: |
          echo "## 📊 $( [ "${{ github.event.inputs.period || 'daily' }}" = "weekly" ] && echo Weekly || echo Daily ) Report Generated (v2.0)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Report saved to \`reports/weekly-report.md\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          head -100 reports/weekly-report.md >> $GITHUB_STEP_SUMMARY || true

  update-stats:
    name: Update Repository Stats
    runs-on: ubuntu-latest
    needs: generate-daily-report

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      # v2.0 fix: the old grep counted EVERY table row (headers, separators,
      # changelog rows…) and logged 1414 APIs. Count actual API listing rows.
      # Fix: `grep -c` already prints 0 and exits 1 when nothing matches, so the old
      # `|| echo "0"` appended a SECOND 0 ("0\n0") and wrote invalid JSON to
      # data/stats.json. `|| true` keeps the step green without corrupting TOTAL.
      - name: Count APIs
        run: |
          TOTAL=$(grep -c '^| \[' README.md || true)
          TOTAL=${TOTAL:-0}
          echo "API_COUNT=$TOTAL" >> $GITHUB_ENV
          echo "Counted $TOTAL API listing rows"

      - name: Update Badge Data
        run: |
          mkdir -p data
          echo "{\"total_api_listings\": $API_COUNT, \"version\": \"2.0.0\", \"updated_daily\": true, \"last_updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/stats.json

      - name: Commit Stats
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Stats Bot"
          git add data/stats.json
          git diff --staged --quiet || git commit -m "📈 Update repository stats"
          git push
