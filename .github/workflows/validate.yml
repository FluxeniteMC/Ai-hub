name: ✅ Validate API Links

on:
  schedule:
    # Cron is UTC. 06:00 UTC on Wednesday == 12:00 (+06:00) on Wednesday.
    - cron: "0 6 * * 3"
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"

permissions:
  contents: read
  issues: write

jobs:
  validate-links:
    name: Check All API Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm install node-fetch

      - name: Extract & Validate Links
        id: validate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/validate-links.js

      - name: Upload Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: link-validation-report
          path: reports/link-validation-*.json
          retention-days: 30

      # Fix: the previous version gated this on `steps.validate.outputs.dead_links_count`,
      # but the Extract & Validate step never defines that output — so the condition was
      # always false and this step never ran. The script now decides for itself.
      - name: Create Issue for Dead Links
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('reports/latest-validation.json', 'utf8'));
            } catch (e) {
              core.info('No validation report found — skipping issue creation.');
              return;
            }

            const deadLinks = report.dead_links || [];
            const blockedNow = report.blocked_links || [];
            const marker = '<!-- dead-links-tracker -->';

            // v2.1: locate the tracker BEFORE the early return so a clean run can
            // close it. Leaving resolved trackers open forever is the other half of
            // the duplicate-issue problem.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dead-links',
              per_page: 100
            });
            const tracker = open.find(i => i.body && i.body.includes(marker));

            if (deadLinks.length === 0) {
              core.info('No dead links found.');
              if (tracker) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: tracker.number,
                  state: 'closed'
                });
                core.info(`Closed resolved dead-link tracker #${tracker.number}.`);
              }
              return;
            }

            const body = `## 🔗 Dead Links Detected

            The weekly link validation found **${deadLinks.length}** broken links.

            | API Name | URL | Status Code | Error |
            |---------|-----|-------------|-------|
            ${deadLinks.map(l => `| ${l.name} | ${l.url} | ${l.status} | ${l.error || 'N/A'} |`).join('\n')}

            *This issue was automatically created by the Link Validation workflow.*
            `;

            // v2.1 fix: this ran weekly and called issues.create unconditionally, so a
            // repo that never fixed its links accumulated one identical open issue
            // per run. Reuse a single open tracker instead (see the lookup above).
            const blocked = blockedNow;
            const footer = blocked.length
              ? `\n\n---\n\n${blocked.length} further link(s) were **blocked**, not dead — rate limits,\nbot shields or server faults. They are recorded in\n\`reports/latest-validation.json\` and need a human to judge.\n`
              : '';

            const payload = `## 🔗 Dead Links Detected

            The weekly link validation found **${deadLinks.length}** broken links.

            | API Name | URL | Status Code | Error |
            |---------|-----|-------------|-------|
            ${deadLinks.map(l => `| ${l.name} | ${l.url} | ${l.status} | ${l.error || 'N/A'} |`).join('\n')}
            ${footer}
            ${marker}
            *This issue is kept up to date by the Link Validation workflow.*
            `;

            if (tracker) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                body: payload
              });
              core.info(`Updated dead-link tracker #${tracker.number}.`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔗 Dead Links Found',
                body: payload,
                labels: ['dead-links', 'automated', 'maintenance']
              });
              core.info('Created dead-link tracker issue.');
            }

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('reports/latest-validation.json', 'utf8'));
            } catch(e) {
              return;
            }

            const blocked = report.blocked_links || [];
            const emoji = report.dead_links.length === 0 ? '✅' : '⚠️';
            const status = report.dead_links.length === 0
              ? 'All links are valid!'
              : `Found ${report.dead_links.length} broken link(s)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${emoji} Link Validation Results\n\n**${status}**\n\n- Total links checked: ${report.total} (${report.unique ?? report.total} unique)\n- Valid: ${report.valid}\n- Dead: ${report.dead_links.length}\n- Blocked (rate limited / bot shield, not dead): ${blocked.length}\n- Redirects: ${report.redirects}`
            });

  validate-with-gemini:
    name: Gemini API Analysis
    runs-on: ubuntu-latest
    needs: validate-links

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        # scripts/gemini-analyzer.js imports `@google/genai` (the current SDK).
        # Installing `@google/generative-ai` here satisfied the job with a package
        # the script never touches, so it failed at require() time.
        run: npm install @google/genai

      - name: Analyze README with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/gemini-analyzer.js

      - name: Upload Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: gemini-analysis-report
          path: reports/gemini-analysis-*.md
          retention-days: 30
