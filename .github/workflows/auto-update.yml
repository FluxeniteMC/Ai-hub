name: 🤖 Daily Auto-Update APIs (Gemini Powered)

on:
  schedule:
    # GitHub Actions cron is always UTC.
    # Target: 00:01 (+06:00 Bangladesh) == 18:01 UTC of the previous day.
    # v2.0: runs EVERY DAY (was weekly on Sunday).
    - cron: "1 18 * * *"
  workflow_dispatch:
    inputs:
      update_type:
        description: "What to update"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - pricing
          - new_apis
          - deprecations
          - descriptions

permissions:
  contents: write
  pull-requests: write

jobs:
  update-with-gemini:
    name: Update API Directory via Gemini (self-editing v2.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm install

      - name: Sanity-check scripts compile
        run: |
          node --check scripts/gemini-updater.js
          # The updater reads instruction.md on every run; fail loudly if the
          # ruleset is missing so it can never silently fall back to guessing.
          test -f instruction.md

      # instruction.md is the authoritative accuracy contract: the bot may only
      # EDIT rows a human already added, never create new ones.
      - name: Run Gemini Update Script (edits existing rows only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPDATE_TYPE: ${{ github.event.inputs.update_type || 'all' }}
          INSTRUCTIONS_PATH: ${{ github.workspace }}/instruction.md
        run: node scripts/gemini-updater.js

      - name: Check for Changes
        id: git_status
        run: |
          git diff --quiet README.md data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Gemini AI Bot 🤖"
          git add README.md data/
          # v2.0 fix: exclude data/backups/ from history bloat — keep only live data
          git reset -- data/backups/ 2>/dev/null || true
          git commit -m "🤖 Daily auto-update (v2.0): AI APIs directory self-edited by Gemini [$(date +'%Y-%m-%d')]"
          git push

      - name: Create Summary
        run: |
          echo "## 🤖 Daily Gemini Update Summary (v2.0)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Update Type**: ${{ github.event.inputs.update_type || 'scheduled (all)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes Made**: ${{ steps.git_status.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cadence**: daily (v2.0)" >> $GITHUB_STEP_SUMMARY
