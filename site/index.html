<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b0d" />
    <title>Fluxenite AI Hub — Searchable AI API &amp; Model Directory</title>
    <meta
      name="description"
      content="Search, filter and compare 500+ AI APIs, LLM models, vector databases and developer tools. A community-maintained directory, generated directly from the FluxeniteMC/Ai-hub repository README and rebuilt on every commit."
    />
    <meta name="author" content="FluxeniteMC" />
    <meta
      name="keywords"
      content="AI API directory, LLM list, AI models, OpenAI alternatives, Anthropic Claude, Gemini, vector database comparison, AI pricing, developer tools, machine learning APIs"
    />
    <link rel="canonical" href="https://fluxenitemc.github.io/Ai-hub/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fluxenite AI Hub" />
    <meta property="og:title" content="Fluxenite AI Hub — Searchable AI API &amp; Model Directory" />
    <meta
      property="og:description"
      content="Search, filter and compare 500+ AI APIs, models and developer tools. Generated from the repository README and rebuilt on every commit."
    />
    <meta property="og:url" content="https://fluxenitemc.github.io/Ai-hub/" />
    <meta property="og:image" content="https://fluxenitemc.github.io/Ai-hub/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fluxenite AI Hub" />
    <meta
      name="twitter:description"
      content="Search, filter and compare 500+ AI APIs, models and developer tools."
    />

    <!--
      Static shell shown before React hydrates. It is removed once the app
      mounts, so a slow or blocked script leaves readable text instead of a
      blank dark page.
    -->
    <script>
      // Applied before first paint so the correct theme is on <html> with no flash.
      // Order: saved preference > OS preference > light.
      (function () {
        try {
          var saved = localStorage.getItem('aihub:theme');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: #0a0b0d;
        color: #a8b0bd;
        font: 400 15px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        z-index: 200;
      }
      #boot b { color: #f2f4f7; font-size: 17px; }
      #boot small { color: #767e8c; }
      noscript p { margin: 6px 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <b>Fluxenite AI Hub</b>
      <small>Loading the AI API catalog…</small>
      <noscript>
        <p>
          This site needs JavaScript to search the catalog.
        </p>
        <p>
          The full directory is readable without it at
          <a href="https://github.com/FluxeniteMC/Ai-hub" style="color: #8b93ff"
            >github.com/FluxeniteMC/Ai-hub</a
          >.
        </p>
      </noscript>
    </div>
    <script>
      // Self-healing boot guard.
      // After a deploy, the CDN can briefly serve a stale cached index.html
      // that points at asset filenames the new deploy has already removed. The
      // app then never mounts and the visitor would be left staring at the
      // placeholder. If the app has not mounted shortly after load, retry once
      // with a cache-busting query so a fresh index.html is fetched.
      (function () {
        var RETRY_KEY = 'aihub:boot-retry';
        var MOUNT_TIMEOUT = 4000;
        function mounted() {
          var root = document.getElementById('root');
          return root && root.childElementCount > 0;
        }
        window.setTimeout(function () {
          if (mounted()) return;
          var alreadyRetried;
          try {
            alreadyRetried = sessionStorage.getItem(RETRY_KEY) === '1';
            sessionStorage.setItem(RETRY_KEY, '1');
          } catch (e) {
            alreadyRetried = false; // storage blocked: try once anyway
          }
          if (alreadyRetried) return;
          var url = window.location.pathname + window.location.search + '?reload=1';
          window.location.replace(url);
        }, MOUNT_TIMEOUT);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
